[k8s_master]
k8s-master ansible_host=//IP address ansible_user=aleksandr ansible_//pass

[k8s_workers]
k8s-worker-01 ansible_host=//IP address ansible_user=aleksandr ansible_//pass

[k8s_cluster:children]
k8s_master
k8s_workers

[k8s_cluster:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3

[k8s_cluster:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3
ansible_become=yes
ansible_become_method=sudo
ansible_become_//pass
